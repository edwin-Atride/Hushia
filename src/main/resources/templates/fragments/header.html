
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<header th:fragment="header" class="header">
    <div class="header-title">
        <h1>Valorant IA</h1>
        <p>Ton assistant tactique Valorant</p>
    </div>

    <div class="header-actions">
        <div class="protocol-switch">
            <button type="button" id="alphaBtn"
                    class="protocol-btn active"
                    onclick="changerProtocole('alpha')">
                α Alpha
            </button>

            <button type="button" id="omegaBtn"
                    class="protocol-btn"
                    onclick="changerProtocole('omega')">
                Ω Omega
            </button>
        </div>

        <span id="protocolLabel" class="protocol-label">
            Alpha
        </span>
    </div>
</header>

</body>
</html>
