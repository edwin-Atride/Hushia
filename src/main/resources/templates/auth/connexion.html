
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::main})}">
<body>
<main class="container auth-page d-flex align-items-center justify-content-center">

    <div class="auth-card">
        <div class="text-center mb-4">
            <h1>Bon retour sur <span>Hush IA</span></h1>
            <p class="muted">Connectez-vous à votre espace.</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">
                    Adresse e-mail
                </label>
                <input type="email" class="form-control"
                       id="email" name="email"
                       placeholder="exemple@email.com" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Mot de passe
                </label>
                <input type="password" class="form-control"
                       id="password" name="password"
                       placeholder="Votre mot de passe" required>
            </div>

            <button type="submit" class="btn hush-btn w-100">
                Se connecter
            </button>

            <p id="loginMessage" class="muted text-center mt-3"
               aria-live="polite"></p>
        </form>
    </div>
</main>
</body>
</html>
