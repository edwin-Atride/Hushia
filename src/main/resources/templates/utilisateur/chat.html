<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::main})}">
<head><title>Hush IA - Chat</title></head>
<body>
<main class="chat-page flex-grow-1 d-flex flex-column">
    <section class="flex-grow-1 overflow-auto p-4">
        <div th:if="${conversation == null}" class="text-center mt-5">
            <h2>Comment puis-je vous aider ?</h2>
            <p class="text-muted">Choisissez un modèle IA et posez votre question.</p>
        </div>
        <div th:each="message : ${messages}" class="mb-4">
            <strong th:text="${message.typeMessage}"></strong>
            <div class="message mt-2 message-content" th:text="${message.contenu}"></div>
        </div>
    </section>
    <div class="border-top p-3">
        <form id="formChat" th:if="${conversation == null}" th:action="@{/conversations}" method="post">
            <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-end gap-2">
                <div class="model-select-wrapper">
                    <select name="idModele" class="form-select model-select" required>
                        <option value="" disabled selected>Choisir un modèle IA</option>
                        <option th:each="modele : ${modeles}" th:value="${modele.id}" th:text="${modele.nom}"></option>
                    </select>
                </div>
                <div class="flex-grow-1"><textarea name="prompt" class="form-control" rows="2" placeholder="Posez votre question..." required></textarea></div>
                <div class="send-button-wrapper"><button class="btn btn-primary" type="submit">Envoyer</button></div>
            </div>
        </form>
        <form th:if="${conversation != null}" th:action="@{/conversations/{id}/messages(id=${conversation.id})}" method="post">
            <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-end gap-2">
                <div class="model-current d-flex align-items-center gap-2">
                    <img th:if="${conversation.modeleIA != null and conversation.modeleIA.cheminLogo != null}"
                         th:src="@{${conversation.modeleIA.cheminLogo}}" alt="Logo du modèle" width="28" height="28">
                    <span th:text="${conversation.modeleIA?.nom}"></span>
                </div>
                <div class="flex-grow-1"><textarea name="prompt" class="form-control" rows="2" placeholder="Écrivez votre message..." required></textarea></div>
                <div class="send-button-wrapper"><button class="btn btn-primary" type="submit">Envoyer</button></div>
            </div>
        </form>
    </div>
</main>
</body>
</html>
